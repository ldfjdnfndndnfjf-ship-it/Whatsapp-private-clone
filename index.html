<!DOCTYPE html>
<html lang="ur" dir="ltr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary SEO Meta Tags -->
    <title>WebChat — Anonymous Secure WhatsApp Clone</title>
    <meta name="title" content="WebChat — Anonymous Secure WhatsApp Clone Portal">
    <meta name="description" content="Secure, anonymous, real-time end-to-end messaging platform. Chat privately without phone numbers using custom usernames. Fast, lightweight, and end-to-end encrypted chat portal.">
    <meta name="keywords" content="WhatsApp Clone, Secure Web Chat, Anonymous Chat App, Cyber Security Chat, Realtime Messaging, Encrypted Web Application, Online Anonymous Messaging, WebChat Pakistan">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Nawab Zada">

    <!-- Open Graph / Facebook / WhatsApp Preview -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://antiblackmaling.vercel.app/">
    <meta property="og:title" content="WebChat — Anonymous Secure Web Messaging">
    <meta property="og:description" content="Join secure end-to-end chats anonymously without sharing phone numbers. Simple, fast, and completely encrypted messaging.">

    <!-- Stylesheets & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wa: {
                            dark: '#111b21',
                            card: '#202c33',
                            border: '#222d34',
                            green: '#00a884',
                            chatBg: '#0b141a',
                            bubbleOut: '#005c4b',
                            bubbleIn: '#202c33'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-wa-dark text-slate-200 h-screen overflow-hidden flex flex-col font-sans select-none">

    <!-- LOGIN / REGISTER MODAL -->
    <div id="authModal" class="fixed inset-0 z-50 bg-wa-dark flex items-center justify-center p-4">
        <div class="bg-wa-card border border-wa-border w-full max-w-md p-6 rounded-2xl shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-wa-green/20 text-wa-green rounded-full flex items-center justify-center mx-auto text-3xl">
                    <i class="fa-brands fa-whatsapp"></i>
                </div>
                <h1 class="text-2xl font-bold text-white">Welcome to WebChat</h1>
                <p class="text-xs text-gray-400">Enter a unique username to start chatting</p>
            </div>

            <div id="authAlert" class="hidden p-3 rounded-xl text-xs font-semibold text-center"></div>

            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="text-xs font-semibold text-gray-300 block mb-1">Username (Unique)</label>
                    <input type="text" id="authUsername" required placeholder="e.g. nawab_zada" class="w-full bg-wa-dark border border-wa-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-wa-green">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-300 block mb-1">Password</label>
                    <input type="password" id="authPassword" required placeholder="••••••••" class="w-full bg-wa-dark border border-wa-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-wa-green">
                </div>
                <button type="submit" id="authBtn" class="w-full bg-wa-green hover:bg-emerald-600 text-black font-bold py-3 rounded-xl transition text-sm">
                    Login / Register
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="appInterface" class="hidden h-full flex flex-col lg:flex-row">
        
        <!-- SIDEBAR -->
        <div id="sidebarView" class="w-full lg:w-96 bg-wa-card border-r border-wa-border flex flex-col h-full">
            
            <!-- Sidebar Header -->
            <div class="p-4 bg-wa-card border-b border-wa-border flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div id="userAvatar" class="w-10 h-10 rounded-full bg-wa-green text-black font-bold flex items-center justify-center text-lg uppercase">
                        U
                    </div>
                    <div>
                        <h3 id="currentUsername" class="font-bold text-sm text-white">Username</h3>
                        <p class="text-[10px] text-wa-green font-semibold">● Online</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 text-gray-400">
                    <button onclick="switchTab('chats')" class="p-2 hover:bg-wa-dark rounded-full" title="Chats"><i class="fa-solid fa-message"></i></button>
                    <button onclick="switchTab('groups')" class="p-2 hover:bg-wa-dark rounded-full" title="Groups"><i class="fa-solid fa-users"></i></button>
                    <button onclick="switchTab('channels')" class="p-2 hover:bg-wa-dark rounded-full" title="Channels"><i class="fa-solid fa-bullhorn"></i></button>
                    <button onclick="logout()" class="p-2 hover:bg-wa-dark rounded-full text-red-400" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="p-3 bg-wa-dark border-b border-wa-border">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-gray-400"></i>
                    <input type="text" id="searchInput" oninput="searchUsers(this.value)" placeholder="Search username to start chat..." class="w-full bg-wa-card border border-wa-border rounded-xl pl-9 pr-4 py-2 text-xs text-white focus:outline-none focus:border-wa-green">
                </div>
            </div>

            <!-- List Containers -->
            <div class="flex-1 overflow-y-auto" id="sidebarList">
                <div class="p-4 text-center text-xs text-gray-500">Loading conversations...</div>
            </div>
        </div>

        <!-- MAIN CHAT VIEW WINDOW -->
        <div id="chatView" class="hidden lg:flex flex-1 bg-wa-chatBg flex-col h-full relative">
            
            <!-- Chat Header -->
            <div id="chatHeader" class="p-4 bg-wa-card border-b border-wa-border flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <button onclick="closeChatMobile()" class="lg:hidden text-gray-400 hover:text-white mr-1"><i class="fa-solid fa-arrow-left"></i></button>
                    <div id="activeChatAvatar" class="w-10 h-10 rounded-full bg-wa-border flex items-center justify-center font-bold text-white uppercase">
                        ?
                    </div>
                    <div>
                        <h4 id="activeChatTitle" class="font-bold text-sm text-white">Select a chat</h4>
                        <p id="activeChatSubtitle" class="text-[10px] text-gray-400">Select a user to start conversation</p>
                    </div>
                </div>
            </div>

            <!-- Messages Container -->
            <div id="messagesContainer" class="flex-1 p-4 overflow-y-auto space-y-3">
                <div class="h-full flex flex-col items-center justify-center text-gray-500 text-xs">
                    <i class="fa-brands fa-whatsapp text-6xl mb-3 text-wa-card"></i>
                    <p>Select a user or search username to begin chatting</p>
                </div>
            </div>

            <!-- Message Input Bar -->
            <form id="messageForm" onsubmit="sendMessage(event)" class="p-3 bg-wa-card border-t border-wa-border flex items-center gap-2">
                <input type="text" id="messageInput" required placeholder="Type a message..." class="flex-1 bg-wa-dark border border-wa-border rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-wa-green">
                <button type="submit" class="bg-wa-green text-black w-10 h-10 rounded-xl flex items-center justify-center hover:bg-emerald-500 transition">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
