<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-black text-red-500">ADMIN CONTROL CENTER</h1>
                <p class="text-xs text-slate-400">Realtime User IP Tracker & System Security Monitor</p>
            </div>
            <div id="userCount" class="bg-red-500/20 text-red-400 px-4 py-2 rounded-xl text-xs font-bold">
                Total Users: Loading...
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Registered Users & IPs Table -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <h3 class="font-bold text-sm text-white mb-4">Registered Users & Captured IPs</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="text-slate-400 border-b border-slate-800">
                            <tr>
                                <th class="p-2">Username</th>
                                <th class="p-2">IP Address</th>
                                <th class="p-2">Password</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable">
                            <!-- Injected dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Active Conversations Inspector -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <h3 class="font-bold text-sm text-white mb-4">Live System Chats Monitor</h3>
                <div id="chatsMonitor" class="space-y-3 text-xs">
                    <!-- Injected dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load All Users & IPs
        db.collection('users').onSnapshot(snapshot => {
            const tbody = document.getElementById('usersTable');
            tbody.innerHTML = '';
            document.getElementById('userCount').innerText = `Total Users: ${snapshot.size}`;
            
            snapshot.forEach(doc => {
                const u = doc.data();
                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-800/50 hover:bg-slate-800/30";
                tr.innerHTML = `
                    <td class="p-2 font-bold text-emerald-400">${u.username}</td>
                    <td class="p-2 font-mono text-cyan-400">${u.ipAddress || 'N/A'}</td>
                    <td class="p-2 text-slate-400">${u.password}</td>
                `;
                tbody.appendChild(tr);
            });
        });

        // Load Live Chats
        db.collection('chats').onSnapshot(snapshot => {
            const container = document.getElementById('chatsMonitor');
            container.innerHTML = '';
            snapshot.forEach(doc => {
                const c = doc.data();
                const div = document.createElement('div');
                div.className = "p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-1";
                div.innerHTML = `
                    <div class="flex justify-between font-bold text-slate-300">
                        <span>${c.participants ? c.participants.join(' ↔ ') : 'Group'}</span>
                    </div>
                    <p class="text-slate-400 text-[11px] truncate">Last Msg: ${c.lastMessage || 'N/A'}</p>
                `;
                container.appendChild(div);
            });
        });
    </script>
</body>
</html>
